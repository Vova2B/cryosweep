[pytest]
# Run from the repository root:
#   QT_QPA_PLATFORM=offscreen python -m pytest
# `testpaths = tests` collects tests/core (core) and tests/gui (GUI). `pythonpath = .` is what
# lets them import cryosweep_core / cryosweep_gui / cryosweep_cli. ~20 modules also build
# fixture paths relative to the working directory, so running from the root is required.
testpaths = tests
pythonpath = .
# Don't promote third-party DeprecationWarnings to errors — Python 3.14 + pandas 3.0 emit many
# that are out of our control and would turn the suite red spuriously.
filterwarnings =
    ignore::DeprecationWarning
addopts = -q
