# Keeps the SHA-pinned GitHub Actions from going stale.
#
# The workflows pin every action to a commit SHA rather than a tag, because a tag can be
# retargeted by whoever owns the action's repository and the workflow would silently run the
# new code. A pin closes that hole but opens the opposite one: pinned means frozen, so a
# security fix in an action never reaches us either. Dependabot is what makes the pin
# maintainable instead of merely old -- it opens a pull request when a pin should move, and
# rewrites both the SHA and the trailing version comment.
#
# Updates arrive as PRs and run CI like any other change, which is the point: taking an
# action update becomes a visible, testable decision rather than something that happened to
# the repository overnight. Note that checkout and setup-python are currently pinned to the
# v4/v5 lines while v7 exists upstream, so expect major-version PRs -- review those rather
# than merging on sight.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
