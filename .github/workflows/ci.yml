name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor pyproject claims; test the claim rather than asserting it.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 needs these even under the offscreen platform plugin.
      - name: System libraries for Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0t64 || \
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[gui]'
          pip install pytest

      # No real measurement data and no reference gallery in a public checkout; the tests that
      # need either skip by design, so this must still be a clean pass.
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -p no:warnings

      - name: CLI smoke
        run: |
          cryosweep --help > /dev/null
          cryosweep analyze examples/magnetization_vsm.dat > /dev/null
          cryosweep probes > /dev/null
