[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cryosweep"
version = "0.1.0"
description = "Agent-drivable analysis of Quantum Design PPMS/MPMS measurement files: VSM, AC susceptibility, thermal transport, resistivity, heat capacity and Hall."
readme = "README.md"
# Name only, matching CITATION.cff (which carries the ORCID). No personal e-mail address:
# package metadata is published verbatim on PyPI and is scraped.
authors = [{ name = "Volodymyr Buturlim" }]
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD-PARTY-LICENSES.md"]
keywords = ["condensed-matter", "physics", "PPMS", "MPMS", "magnetometry", "transport", "thermal-transport"]
classifiers = [
    # No License:: classifier: PEP 639 supersedes them with the `license` expression above.
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
# Derived from the real import graph.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pydantic>=2.6",
    "matplotlib>=3.11",
    "PySide6>=6.7",
]

[project.scripts]
cryosweep = "cryosweep_cli.__main__:main"

[project.gui-scripts]
cryosweep-gui = "cryosweep_gui.app:run"

# Only the three code packages are packaged. examples/ is deliberately NOT included, so a
# wheel/sdist install has no examples/ directory -- and the README quickstart references
# examples/*.dat by path. That is fine while distribution is by git clone; REVISIT BEFORE
# PUBLISHING TO PyPI, or those documented commands fail for pip users.
[tool.setuptools.packages.find]
include = ["cryosweep_core*", "cryosweep_gui*", "cryosweep_cli*"]
