[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cryosweep"
version = "0.3.1"
description = "Agent-drivable analysis of Quantum Design PPMS/MPMS measurement files: VSM, AC susceptibility, thermal transport, resistivity, heat capacity and Hall."
readme = "README.md"
# Name only, matching CITATION.cff (which carries the ORCID). No personal e-mail address:
# package metadata is published verbatim on PyPI and is scraped.
authors = [{ name = "Volodymyr Buturlim" }]
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD-PARTY-LICENSES.md"]
keywords = ["condensed-matter", "physics", "PPMS", "MPMS", "magnetometry", "transport", "thermal-transport"]
classifiers = [
    # No License:: classifier: PEP 639 supersedes them with the `license` expression above.
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
# Derived from the real import graph.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pydantic>=2.6",
    "matplotlib>=3.11",
]

# The desktop GUI is optional: `pip install cryosweep[gui]`. The core and CLI are Qt-free by
# design (tests/core/test_qt_free.py enforces it), and Qt is by far the heaviest thing here --
# the PySide6 meta-package drags in PySide6-Addons (175 MB: Charts, 3D, WebEngine, Multimedia)
# that this codebase never imports. Measured against the real import graph: QtWidgets, QtCore
# and QtGui only, all of which live in PySide6-Essentials (80 MB). If a future feature ever
# needs an Addons module, widen this one line back to "PySide6".
[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]

[project.urls]
Homepage = "https://github.com/Vova2B/cryosweep"
Source = "https://github.com/Vova2B/cryosweep"
Issues = "https://github.com/Vova2B/cryosweep/issues"
Changelog = "https://github.com/Vova2B/cryosweep/blob/main/CHANGELOG.md"
"Physics reference" = "https://github.com/Vova2B/cryosweep/blob/main/docs/physics-reference.md"

[project.scripts]
cryosweep = "cryosweep_cli.__main__:main"

[project.gui-scripts]
cryosweep-gui = "cryosweep_gui.app:run"

# Only the three code packages are packaged. examples/ is deliberately NOT included, so a
# wheel/sdist install has no examples/ directory -- and the README quickstart references
# examples/*.dat by path. That is fine while distribution is by git clone; REVISIT BEFORE
# PUBLISHING TO PyPI, or those documented commands fail for pip users.
[tool.setuptools.packages.find]
include = ["cryosweep_core*", "cryosweep_gui*", "cryosweep_cli*"]
